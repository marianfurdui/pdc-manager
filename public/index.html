<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c1a">
  <meta name="description" content="A calm remote control for Daikin Altherma heat pumps">
  <title>Altherma Control</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Altherma Control home">
        <img src="/mark.svg" alt="">
        <span><strong>Altherma</strong><small>CONTROL</small></span>
      </a>
      <div class="header-actions">
        <span class="connection-pill" id="connection-pill"><i></i>Checking system</span>
        <button class="icon-button" id="refresh-button" title="Refresh device data" aria-label="Refresh device data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 9A7 7 0 0 1 18.7 6.3L20 8M4 16l1.3 1.7A7 7 0 0 0 17.9 15"/></svg>
        </button>
      </div>
    </header>

    <nav class="rail" aria-label="Primary navigation">
      <a href="#overview" data-route="overview" class="active"><span class="nav-icon">⌂</span><span>Overview</span></a>
      <a href="#controls" data-route="controls"><span class="nav-icon">⌁</span><span>Controls</span></a>
      <a href="#schedule" data-route="schedule"><span class="nav-icon">□</span><span>Schedule</span></a>
      <a href="#system" data-route="system"><span class="nav-icon">◉</span><span>System</span></a>
    </nav>

    <main id="app" tabindex="-1">
      <section class="loading-state">
        <div class="spinner"></div>
        <p>Reading your heat pump…</p>
      </section>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/app.js?v=5"></script>
</body>
</html>
