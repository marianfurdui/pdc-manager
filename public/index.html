<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf0f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10171c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Remote control for a Daikin Altherma heat pump">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Altherma">
  <title>Altherma</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=11">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Altherma home">
        <img src="/mark.svg" alt="">
        <span>Altherma</span>
      </a>
      <div class="header-actions">
        <span class="connection-pill" id="connection-pill" role="status"><i></i>Checking</span>
        <button class="icon-button" id="refresh-button" title="Get the latest readings from Daikin" aria-label="Get the latest readings from Daikin">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M6.1 9A7 7 0 0 1 18.7 6.3L20 8M4 16l1.3 1.7A7 7 0 0 0 17.9 15"/></svg>
        </button>
      </div>
    </header>

    <nav class="rail" aria-label="Primary">
      <a href="#overview" data-route="overview" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#controls" data-route="controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Controls</span></a>
      <a href="#schedule" data-route="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Schedule</span></a>
      <a href="#system" data-route="system"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a10 10 0 0 1 14 0M8 12.5a5.5 5.5 0 0 1 8 0"/><circle cx="12" cy="16.5" r="1.3"/></svg><span>System</span></a>
    </nav>

    <main id="app" tabindex="-1">
      <section class="loading-state">
        <div class="spinner"></div>
        <p>Reading your heat pump…</p>
      </section>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/app.js?v=15"></script>
</body>
</html>
